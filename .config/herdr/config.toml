onboarding = false

[theme]
name = "terminal"

# tmux: set -g mouse on  (herdr default, kept explicit)
auto_switch = false
[ui]
mouse_capture = true
prompt_new_tab_name = false
pane_gaps = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

focus_pane_left  = "prefix+left"
focus_pane_down  = "prefix+down"
focus_pane_up    = "prefix+up"
focus_pane_right = "prefix+right"

split_horizontal = ['prefix+"', "prefix+'"]
split_vertical   = ["prefix+%"]

reload_config = "prefix+r"
resize_mode   = "prefix+shift+r"

# tmux defaults
new_tab       = "prefix+c"         # new-window
next_tab      = "prefix+n"         # next-window
previous_tab  = "prefix+p"         # previous-window
switch_tab    = ["prefix+1", "prefix+2", "prefix+3", "prefix+4", "prefix+5", "prefix+6", "prefix+7", "prefix+8"]      # select-window 1-8 (9/0 = agents)
rename_tab    = "prefix+comma"     # rename-window
close_tab     = "prefix+ampersand" # kill-window
close_pane    = "prefix+x"         # kill-pane
zoom          = "prefix+z"         # resize-pane -Z
copy_mode     = "prefix+["         # copy-mode (vi: v select, y copy)
detach        = "prefix+d"         # detach-client
workspace_picker = "prefix+w"      # choose-tree
goto          = "prefix+s"         # choose-session
previous_workspace = "prefix+("    # switch-client -p
next_workspace     = "prefix+)"    # switch-client -n
previous_agent     = "prefix+9"
next_agent         = "prefix+0"
rename_workspace = "prefix+shift+4" # rename-session
settings      = "prefix+shift+s"
open_notification_target = "prefix+shift+o"

# vim-tmux-navigator: Ctrl+h/j/k/l moves between herdr panes and nvim splits.
# navigate.sh forwards the key to nvim when nvim is focused; nvim calls
# `herdr pane focus` when it is already at its edge.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/navigate.sh left"
description = "navigate left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/navigate.sh down"
description = "navigate down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/navigate.sh up"
description = "navigate up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/navigate.sh right"
description = "navigate right (vim-aware)"
